      simp:defaults.auditd.simp.audit_ssh_keysign_cmd: true
      simp:defaults.auditd.simp.audit_suspicious_apps: true
      simp:defaults.auditd.simp.audit_systemd: true
      simp:defaults.auditd.simp.audit_crontab_cmd: true
      simp:defaults.auditd.simp.audit_pam_timestamp_check_cmd: true
      simp:defaults.auditd.stig.audit_unsuccessful_file_operations: true
      simp:defaults.auditd.stig.audit_chown: true
      simp:defaults.auditd.stig.audit_chmod: true
      simp:defaults.auditd.stig.audit_attr: true
      simp:defaults.auditd.stig.audit_rename_remove: true
      simp:defaults.auditd.stig.audit_suid_sgid: true
      simp:defaults.auditd.stig.audit_kernel_modules: true
      simp:defaults.auditd.stig.audit_mount: true
      simp:defaults.auditd.stig.audit_local_account: true
      simp:defaults.auditd.stig.audit_selinux_cmds: true
      simp:defaults.auditd.stig.audit_login_files: true
      simp:defaults.auditd.stig.audit_cfg_sudoers: true
      simp:defaults.auditd.stig.audit_passwd_cmds: true
      simp:defaults.auditd.stig.audit_priv_cmds: true
      simp:defaults.auditd.stig.audit_postfix_cmds: true
      simp:defaults.auditd.stig.audit_ssh_keysign_cmd: true
