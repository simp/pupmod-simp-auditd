      simp:defaults.auditd.simp.audit_cfg_sudoers: true
      simp:defaults.auditd.simp.audit_cfg_grub: true
      simp:defaults.auditd.simp.audit_cfg_sys: true
      simp:defaults.auditd.simp.audit_cfg_cron: true
      simp:defaults.auditd.simp.audit_cfg_shell: true
      simp:defaults.auditd.simp.audit_cfg_pam: true
      simp:defaults.auditd.simp.audit_cfg_security: true
      simp:defaults.auditd.simp.audit_cfg_services: true
      simp:defaults.auditd.simp.audit_cfg_xinetd: true
