    settings:
      parameter: auditd::disk_full_action
      value: rotate
  simp:defaults.auditd.flush:
    type: puppet-class-parameter
    settings:
      parameter: auditd::flush
      value: incremental
  simp:defaults.auditd.freq:
    type: puppet-class-parameter
    settings:
      parameter: auditd::freq
      value: 20
  simp:defaults.auditd.log_file:
    type: puppet-class-parameter
    settings:
      parameter: auditd::log_file
      value: /var/log/audit/audit.log
  simp:defaults.auditd.log_format:
    type: puppet-class-parameter
    settings:
      parameter: auditd::log_format
      value: raw
  simp:defaults.auditd.max_log_file:
    type: puppet-class-parameter
    settings:
      parameter: auditd::max_log_file
      value: 24
  simp:defaults.auditd.max_log_file_action:
    type: puppet-class-parameter
    settings:
      parameter: auditd::max_log_file_action
      value: rotate

  # Pulls $auditd::lname (the node FQDN) into auditd.conf alongside it, so the
  # `name` key needs no check of its own.
  simp:defaults.auditd.name_format:
    type: puppet-class-parameter
    settings:
      parameter: auditd::name_format
      value: USER

  simp:defaults.auditd.num_logs:
    type: puppet-class-parameter
    settings:
      parameter: auditd::num_logs
      value: 5
  simp:defaults.auditd.priority_boost:
    type: puppet-class-parameter
    settings:
      parameter: auditd::priority_boost
      value: 4
  simp:defaults.auditd.q_depth:
    type: puppet-class-parameter
    settings:
      parameter: auditd::q_depth
      value: 160
  simp:defaults.auditd.overflow_action:
    type: puppet-class-parameter
    settings:
      parameter: auditd::overflow_action
      value: SYSLOG
  simp:defaults.auditd.max_restarts:
    type: puppet-class-parameter
    settings:
      parameter: auditd::max_restarts
      value: 10
  simp:defaults.auditd.write_logs:
    type: puppet-class-parameter
    settings:
      parameter: auditd::write_logs
      value: true

  # --- Rule preamble (00_head.rules, 99_tail.rules) and default drops
  # (05_default_drop.rules). ---
  # Written only once a rule profile or purge_auditd_rules claims rules.d. The
  # files are edited line by line; each line is managed only when its parameter
  # is set.
  simp:defaults.auditd.buffer_size:
    type: puppet-class-parameter
    settings:
      parameter: auditd::buffer_size
      value: 16384
  simp:defaults.auditd.failure_mode:
    type: puppet-class-parameter
    settings:
      parameter: auditd::failure_mode
      value: 1
  simp:defaults.auditd.rate:
    type: puppet-class-parameter
    settings:
      parameter: auditd::rate
      value: 0
  simp:defaults.auditd.loginuid_immutable:
    type: puppet-class-parameter
    settings:
      parameter: auditd::loginuid_immutable
      value: true
  simp:defaults.auditd.ignore_errors:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_errors
      value: true
  simp:defaults.auditd.ignore_failures:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_failures
      value: true
  simp:defaults.auditd.ignore_anonymous:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_anonymous
      value: true
  simp:defaults.auditd.ignore_system_services:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_system_services
      value: true
  simp:defaults.auditd.ignore_crond:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_crond
      value: true
  simp:defaults.auditd.ignore_time_daemons:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_time_daemons
      value: true
  simp:defaults.auditd.ignore_crypto_key_user:
    type: puppet-class-parameter
    settings:
      parameter: auditd::ignore_crypto_key_user
      value: true
  simp:defaults.auditd.immutable:
    type: puppet-class-parameter
    settings:
      parameter: auditd::immutable
      value: false

  # --- Formerly read from simp_options::*; the parameters no longer are. ---
  simp:defaults.auditd.syslog:
    type: puppet-class-parameter
    settings:
      parameter: auditd::syslog
      value: true
  simp:defaults.auditd.config.audisp.syslog.rsyslog:
    type: puppet-class-parameter
    settings:
      parameter: auditd::config::audisp::syslog::rsyslog
      value: true

  # --- Rule profile toggles, in each profile's base rules file. ---
  # Each one was a Boolean with a value; unset now leaves its rules alone.
  # audit_32bit_operations defaulted to true on x86_64 and false elsewhere;
