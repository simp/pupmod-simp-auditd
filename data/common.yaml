---
lookup_options:
  auditd::config::audit_profiles::simp::audit_auditd_cmds_list:
    merge:
      strategy: deep
      knockout_prefix: --
  auditd::config::audit_profiles::simp::basic_root_audit_syscalls:
    merge:
      strategy: deep
      knockout_prefix: --
  auditd::config::audit_profiles::simp::aggressive_root_audit_syscalls:
    merge:
      strategy: deep
      knockout_prefix: --
  auditd::config::audit_profiles::simp::insane_root_audit_syscalls:
    merge:
      strategy: deep
      knockout_prefix: --
  auditd::config::audit_profiles::simp::audit_suspicious_apps_list:
    merge:
      strategy: deep
      knockout_prefix: --

auditd::config::audit_profiles::simp::basic_root_audit_syscalls:
  - 'capset'
  - 'mknod'
  - 'mknodat'
  - 'pivot_root'
  - 'quotactl'
  - 'setsid'
  - 'adjtimex'
  - 'settimeofday'
  - 'setuid'
  - 'swapoff'
  - 'swapon'

auditd::config::audit_profiles::simp::aggressive_root_audit_syscalls:
  - 'capset'
  - 'mknod'
  - 'mknodat'
  - 'pivot_root'
  - 'quotactl'
  - 'setsid'
  - 'adjtimex'
  - 'settimeofday'
  - 'setuid'
  - 'swapoff'
  - 'swapon'
  - 'execve'
  - 'rename'
  - 'renameat'
  - 'rmdir'
  - 'unlink'
  - 'unlinkat'

auditd::config::audit_profiles::simp::insane_root_audit_syscalls:
  - 'capset'
  - 'mknod'
  - 'mknodat'
  - 'pivot_root'
  - 'quotactl'
  - 'setsid'
  - 'adjtimex'
  - 'settimeofday'
  - 'setuid'
  - 'swapoff'
  - 'swapon'
  - 'execve'
  - 'rename'
  - 'renameat'
  - 'rmdir'
  - 'unlink'
  - 'unlinkat'
  - 'write'
  - 'chown'
  - 'fchown'
  - 'fchownat'
  - 'lchown'
  - 'creat'
  - 'fork'
  - 'vfork'
  - 'link'
  - 'linkat'
  - 'symlink'
  - 'symlinkat'
  - 'mkdir'
  - 'mkdirat'

auditd::config::audit_profiles::simp::audit_suspicious_apps_list:
  - '/usr/bin/nc'
  - '/usr/bin/ncat'
  - '/usr/bin/nmap'
  - '/usr/bin/rawshark'
  - '/usr/bin/socat'
  - '/usr/bin/wireshark'
  - '/usr/sbin/tcpdump'
  - '/usr/sbin/traceroute'
  - '/usr/sbin/traceroute6'

auditd::config::audit_profiles::simp::audit_auditd_cmds_list:
  - '/usr/sbin/aulast'
  - '/usr/sbin/aulastlogin'
  - '/usr/sbin/aureport'
  - '/usr/sbin/ausearch'
  - '/usr/sbin/auvirt'

# The SUID/SGID commands the STIG profile audits by default. These were
# identical across every supported OS, so they live here rather than in
# fifteen byte-identical os/*.yaml files.
auditd::config::audit_profiles::stig::default_suid_sgid_cmds:
  - "/usr/bin/at"
  - "/usr/bin/chage"
  - "/usr/bin/chcon"
  - "/usr/bin/chfn"
  - "/usr/bin/chsh"
  - "/usr/bin/crontab"
  - "/usr/bin/fusermount"
  - "/usr/bin/gpasswd"
  - "/usr/bin/incrontab"
  - "/usr/bin/ksu"
  - "/usr/bin/locate"
  - "/usr/bin/mount"
  - "/usr/bin/newgidmap"
  - "/usr/bin/newgrp"
  - "/usr/bin/newuidmap"
  - "/usr/bin/passwd"
  - "/usr/bin/pkexec"
  - "/usr/bin/screen"
  - "/usr/bin/ssh-agent"
  - "/usr/bin/su"
  - "/usr/bin/sudo"
  - "/usr/bin/sudoedit"
  - "/usr/bin/umount"
  - "/usr/bin/wall"
  - "/usr/bin/write"
  - "/usr/bin/Xorg"
  - "/usr/lib64/dbus-1/dbus-daemon-launch-helper"
  - "/usr/libexec/dbus-1/dbus-daemon-launch-helper"
  - "/usr/libexec/openssh/ssh-keysign"
  - "/usr/libexec/pt_chown"
  - "/usr/libexec/sssd/krb5_child"
  - "/usr/libexec/sssd/ldap_child"
  - "/usr/libexec/sssd/proxy_child"
  - "/usr/libexec/sssd/selinux_child"
  - "/usr/libexec/utempter/utempter"
  - "/usr/lib/polkit-1/polkit-agent-helper-1"
  - "/usr/sbin/mount.nfs"
  - "/usr/sbin/netreport"
  - "/usr/sbin/pam_timestamp_check"
  - "/usr/sbin/postdrop"
  - "/usr/sbin/postqueue"
  - "/usr/sbin/restorecon"
  - "/usr/sbin/semanage"
  - "/usr/sbin/setfiles"
  - "/usr/sbin/setsebool"
  - "/usr/sbin/seunshare"
  - "/usr/sbin/unix_chkpwd"
  - "/usr/sbin/userhelper"
  - "/usr/sbin/usernetctl"
